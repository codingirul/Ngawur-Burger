<script>
//#CALC
const N=v=>{if(typeof v==='number')return isFinite(v)&&v>=0?v:null;if(v==null)return null;let s=String(v).trim().replace(/rp|%|\s/gi,'');if(!s||/[^\d.,]/.test(s))return null;
if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return null;const n=parseFloat(s);return isFinite(n)?n:null};
const rp=n=>{if(n==null||!isFinite(n))return'–';const r=Math.round(n);return(r<0?'-':'')+'Rp '+String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
const pc=n=>n==null||!isFinite(n)?'–':n.toFixed(1).replace('.',',')+'%';
const nf=n=>{if(n==null||!isFinite(n))return'–';const[a,b]=String(Math.round(n*10)/10).split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(b?','+b:'')};
const ru=c=>c<100?'Rp '+c.toFixed(2).replace('.',','):rp(c);
function uc(S,id,d=0){const i=S.ing.find(x=>x.id===id);if(!i||d>5)return null;
if(i.mix){const y=N(i.yield);if(!y)return null;let t=0;for(const m of i.mix){const q=N(m.q),c=uc(S,m.id,d+1);if(q==null||c==null)return null;t+=q*c}return t/y}
const p=N(i.price),q=N(i.qty),l=Math.min(N(i.loss)||0,95);if(p==null||!q)return null;return p/(q*(1-l/100))}
function hpp(S,m){let t=0,miss=0;for(const r of m.rec){const c=uc(S,r.id),q=N(r.q);if(c==null||q==null)miss++;else t+=c*q}return{v:t,miss:m.rec.length?miss:1}}
function an(price,h){const p=N(price);if(!p)return null;return{gp:p-h,mg:(p-h)/p*100,fc:h/p*100}}
const st=(S,fc)=>fc<=(N(S.set.fcG)??35)?'g':fc<=(N(S.set.fcY)??45)?'y':'r';
function sg(h,fc,mg,step){const up=x=>Math.ceil(x/step-1e-9)*step;return{a:fc>0&&fc<100?up(h/(fc/100)):null,b:mg>0&&mg<100?up(h/(1-mg/100)):null}}
function fx(S){const m=['sewa','gaji','gas','listrik','promosi','lain'].reduce((a,k)=>a+(N(S.opex[k])||0),0),d=N(S.set.days);return{m,days:d,d:d>0?m/d:null}}
function sm(S,f=1){let q=0,om=0,hp=0,miss=0;for(const m of S.menu){const n=(N(S.sim[m.id])||0)*f;if(!n)continue;const h=hpp(S,m);q+=n;om+=(N(m.price)||0)*n;hp+=h.v*n;if(h.miss||!N(m.price))miss++}
const F=fx(S),gp=om-hp,net=F.d==null?null:gp-F.d;return{q,om,hp,gp,net,mon:net==null?null:net*F.days,miss,F}}
function bep(S){const s=sm(S),F=s.F;if(!s.q||s.om<=0)return{err:'Isi jumlah jualan di tab Simulasi dulu.'};if(F.d==null)return{err:'Isi hari buka (harus lebih dari 0) di tab Biaya.'};
const c=s.gp/s.q;if(c<=0)return{err:'Laba kotor per porsi nol atau minus, jadi tidak ada titik impas. Naikkan harga atau turunkan HPP.'};
const r=s.gp/s.om;return{c,pd:Math.ceil(F.d/c-1e-9),rd:F.d/r,pm:Math.ceil(F.m/c-1e-9),rm:F.m/r}}
function bh(S,net){const r=Math.min(N(S.set.res)||0,100),ps=S.set.part.map(p=>N(p.p)||0),n=Math.max(net,0),res=n*r/100;return{r,res,tot:ps.reduce((a,b)=>a+b,0),parts:ps.map(p=>(n-res)*p/100)}}
function need(S,f=1,bad){const o={},add=(id,q,d)=>{const i=S.ing.find(x=>x.id===id);if(!i||d>5||!(q>0))return;if(i.mix){const y=N(i.yield);if(!y){bad&&bad.push(i.n);return}for(const m of i.mix)add(m.id,q*(N(m.q)||0)/y,d+1)}else o[id]=(o[id]||0)+q};
for(const m of S.menu){const n=(N(S.sim[m.id])||0)*f;if(n)for(const r of m.rec)add(r.id,n*(N(r.q)||0),0)}return o}
function shop(S){const f=S.set.per==='Mingguan'?(N(S.set.dpw)||0):1,b=N(S.set.bufr)||0,bad=[],nd=need(S,f,bad),rows=[];let tot=0,miss=0;
for(const id in nd){const i=S.ing.find(x=>x.id===id),l=Math.min(N(i.loss)||0,95),g=nd[id]/(1-l/100)*(1+b/100),q=N(i.qty),p=N(i.price);let k=null,c=null;if(q&&p!=null){k=Math.ceil(g/q-1e-9);c=k*p;tot+=c}else miss++;rows.push({i,g,k,c})}
rows.sort((a,b)=>a.i.n.localeCompare(b.i.n));return{rows,tot,miss,f,bad:[...new Set(bad)]}}
const onp=(price,kom,step)=>{const p=N(price),k=N(kom);return p&&k!=null&&k<100?(k===0?p:Math.ceil(p/(1-k/100)/step-1e-9)*step):null};
function pkg(S,k){let nor=0,h=0,miss=0;for(const it of k.items){const m=S.menu.find(x=>x.id===it.id),q=N(it.q);if(!m||q==null)continue;nor+=(N(m.price)||0)*q;const t=hpp(S,m);h+=t.v*q;if(t.miss)miss++}
let pr=N(k.price);const d=N(k.disc);if(pr==null&&d!=null)pr=nor*(1-Math.min(d,100)/100);if(!pr)return{nor,h,miss,pr:null};
const gp=pr-h,ngp=nor-h;return{nor,h,miss,pr,gp,ngp,mg:gp/pr*100,fc:h/pr*100,save:nor-pr,more:gp>0?(ngp/gp-1)*100:null}}

{n:'Telur',cat:'Add-on',price:5000,rec:R('tl',1)},{n:'Keju',cat:'Add-on',price:5000,rec:R('ke',1)},{n:'Beef Patty',cat:'Add-on',price:13000,rec:R('dg',60)},{n:'Bawang Bombay',cat:'Add-on',price:3000,rec:R('bb',30)},{n:'Saus Ngawur',cat:'Add-on',price:3000,rec:R('sp',20)}].map((m,i)=>({id:'m'+i,...m}));

o.pk=o.pk||(ex?[{id:'p0',n:'Paket Hemat Double (CONTOH)',items:R('m1',1,'m6',1,'m11',1),disc:null,price:62000}]:[]);
o.on=o.on||{sel:0,plat:['GoFood','GrabFood','ShopeeFood'].map(n=>({n,kom:ex?20:null}))};return o}

`<button class="b l" data-a="delMenu" data-i="${x}">Hapus menu</button></details>`}
